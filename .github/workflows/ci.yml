name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-guard:
    name: SDK Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure no Showcase sources in SDK
        run: |
          if find gearui-kit/src/commonMain/kotlin/com/gearui/components -name '*Showcase.kt' | grep -q .; then
            echo "Showcase files must not exist in gearui-kit SDK sources."
            exit 1
          fi

      - name: Verify sample index integrity
        run: ./scripts/ci/check_sample_index.sh

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Android targets
        run: ./gradlew --no-daemon :gearui-kit:assemble :sample:assembleDebug

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build iOS simulator targets
        # gearui-kit declares no iOS framework binary (it ships as a klib), so
        # linkDebugFrameworkIosSimulatorArm64 never existed on it and this step
        # could not resolve. Link its main binaries instead; the framework task
        # is only valid on :sample.
        run: ./gradlew --no-daemon :gearui-kit:iosSimulatorArm64MainBinaries :sample:linkDebugFrameworkIosSimulatorArm64

  api-compat-check:
    name: Public API Compatibility (SPEC 4.2)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify public API surface against frozen baseline
        run: ./gradlew --no-daemon :gearui-kit:apiCheck
