name: Guardrails

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-guardrails:
    name: Architecture Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ripgrep is not preinstalled on the GitHub-hosted Ubuntu images (checked
      # against the 22.04 and 24.04 manifests). Four guards require it and fail
      # loudly when it is missing rather than scanning nothing, so install it
      # before they run. Conditional, so a future image that ships rg costs
      # nothing here.
      - name: Ensure ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi
          rg --version

      - name: Hardcoded color guard (components)
        run: ./scripts/ci/check_component_hardcoded_colors.sh

      - name: Runtime boundary guard (sample)
        run: ./scripts/ci/check_sample_runtime_boundary.sh

      - name: SafeArea runtime contract guard
        run: ./scripts/ci/check_safearea_runtime_contract.sh

      - name: Single App root guard
        run: ./scripts/ci/check_single_app_root.sh

      - name: Token schema compatibility (SPEC 4.1)
        run: ./scripts/ci/check_token_compat.sh

      - name: i18n default-text guard
        run: ./scripts/ci/check_i18n_default_text.sh

      - name: Hardcoded radius guard (shape scale)
        run: ./scripts/ci/check_component_hardcoded_radius.sh

      - name: Hardcoded elevation guard (elevation scale)
        run: ./scripts/ci/check_component_hardcoded_elevation.sh

      - name: Hardcoded border width guard (stroke scale)
        run: ./scripts/ci/check_component_hardcoded_border.sh

      - name: Hardcoded icon size guard (icon scale)
        run: ./scripts/ci/check_component_hardcoded_icon_size.sh

      - name: Hardcoded spacing guard (components)
        run: ./scripts/ci/check_component_hardcoded_spacing.sh

      - name: Legacy Float token pool guard
        run: ./scripts/ci/check_legacy_token_pool.sh

      - name: iOS pod resources guard
        run: ./scripts/ci/check_ios_pod_resources.sh

      - name: Emoji-as-icon guard
        run: ./scripts/ci/check_emoji_as_icon.sh

      - name: State param naming guard (SPEC 6.1)
        run: ./scripts/ci/check_state_param_naming.sh

      - name: English comment guard
        run: ./scripts/ci/check_english_comments.sh
