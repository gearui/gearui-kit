# Kotlin
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
kotlin.apple.xcodeCompatibility.nowarn=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34
android.enableR8.fullMode=false

# Gradle
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# Publishing metadata
POM_GROUP_ID=com.gearui
POM_ARTIFACT_ID=gearui-kit
POM_VERSION=1.0.0-beta4
POM_NAME=gearui-kit
POM_DESCRIPTION=GearUI Kotlin Multiplatform UI Kit
POM_URL=https://gearui.com
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_ORGANIZATION_NAME=Shanghai Boyu Information Technology Co., Ltd.
POM_ORGANIZATION_URL=https://netonstream.com
POM_DEVELOPER_ID=zoujiaqing
POM_DEVELOPER_NAME=zoujiaqing
POM_DEVELOPER_EMAIL=zoujiaqing@gmail.com
POM_DEVELOPER_URL=https://netonstream.com
POM_SCM_URL=https://github.com/gearui/gearui-kit
POM_SCM_CONNECTION=scm:git:https://github.com/gearui/gearui-kit.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/gearui/gearui-kit.git
org.jetbrains.compose.experimental.jscanvas.enabled=true

# KuiklyUI — the single source of truth for the renderer version.
#
# gearui-kit owns this dependency; consumers must not restate it. Everything
# derives from these three values: the Gradle build files below, the iOS
# Podfiles (which read this file as text), and the ohos package manifest.
#
# Artifacts are published per Kotlin version, so the coordinate suffix differs
# per target: the main build uses KUIKLY_KOTLIN, and the parallel ohos build
# uses KUIKLY_KOTLIN_OHOS because those artifacts are compiled against a
# Tencent Kotlin distribution.
KUIKLY_VERSION=2.28.0
KUIKLY_KOTLIN=2.1.21
KUIKLY_KOTLIN_OHOS=2.0.21-ohos
